[project]
name = "whisper-demo-audio"
version = "0.1.0"
description = "Synthesised music and sound effects for the Whisper demo Film, driven by the shared timeline."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisper_audio"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
