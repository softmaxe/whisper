name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to match against the package version
        required: false
        default: ""
        type: string
    secrets:
      WHISPER_SIGNING_CERTIFICATE:
        description: Base64-encoded PKCS12 matching the pinned release certificate
        required: false
      WHISPER_SIGNING_PASSWORD:
        description: Password for the release signing PKCS12
        required: false
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      archive:
        value: ${{ jobs.build.outputs.archive }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package native macOS arm64
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive: ${{ steps.metadata.outputs.archive }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate architecture and package version
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers
          xcodebuild -version
          xcrun swift --version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 27
          if [[ -n "$RELEASE_TAG" && ( "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ) ]]; then
            echo "::error::Release credentials are restricted to a matching pushed release tag."
            exit 1
          fi
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          assert.equal(process.versions.node.split(".")[0], "24");
          assert.match(pkg.version, /^[0-9]+\.[0-9]+\.[0-9]+$/);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[""].version, pkg.version);
          if (process.env.RELEASE_TAG) {
            assert.equal(process.env.RELEASE_TAG, "v" + pkg.version);
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            "version=" + pkg.version + "\narchive=whisper-" + pkg.version +
              "-macos-arm64" + (process.env.RELEASE_TAG ? "" : "-development") + ".zip\n"
          );
          NODE

      - name: Install native codec build dependency
        run: command -v pkg-config >/dev/null || brew install pkgconf

      - name: Install dependencies
        run: npm ci

      - name: Check Whisper
        run: npm run quality-check

      - name: Test native workflows
        run: npm run native:test

      - name: Package development application
        if: inputs.release-tag == ''
        run: npm run pack

      - name: Package release application with the persistent signing identity
        if: inputs.release-tag != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          WHISPER_SIGNING_CERTIFICATE: ${{ secrets.WHISPER_SIGNING_CERTIFICATE }}
          WHISPER_SIGNING_PASSWORD: ${{ secrets.WHISPER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$WHISPER_SIGNING_CERTIFICATE" || -z "$WHISPER_SIGNING_PASSWORD" ]]; then
            echo "::error::Release signing credentials are required; ad-hoc releases are not allowed."
            exit 1
          fi
          npm run test:signing
          npm run pack:release

      - name: Verify application
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          app="dist/native-development-arm64/Whisper.app"
          if [[ -n "$RELEASE_TAG" ]]; then app="dist/native-arm64/Whisper.app"; fi
          plist="$app/Contents/Info.plist"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Whisper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Whisper"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "local.whisper.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "27.0"
          if [[ -n "$RELEASE_TAG" ]]; then
            node scripts/sign-macos-release.js --verify "$app"
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$VERSION"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = "arm64"

      - name: Verify packaged archive and checksum
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail
          unzip -t "release/$ARCHIVE"
          (
            cd release
            shasum -a 256 -c "$ARCHIVE.sha256"
          )

      - name: Upload application package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-arm64
          path: |
            release/${{ steps.metadata.outputs.archive }}
            release/${{ steps.metadata.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
