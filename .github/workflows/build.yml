name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to match against the package version
        required: false
        default: ""
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      archive:
        value: ${{ jobs.build.outputs.archive }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package macOS arm64
    runs-on: macos-15
    timeout-minutes: 45
    # Signing secrets live in the release environment, which only v* tags can use.
    environment: ${{ inputs.release-tag != '' && 'release' || '' }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive: ${{ steps.metadata.outputs.archive }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate architecture and package version
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/check-package-version.js

      - name: Install dependencies
        run: npm ci

      - name: Check Whisper
        run: npm run quality-check

      - name: Package development application
        if: inputs.release-tag == ''
        env:
          # Manual builds do not receive the release signing identity.
          CSC_FOR_PULL_REQUEST: "true"
        run: npm run pack

      - name: Package release application with the persistent signing identity
        if: inputs.release-tag != ''
        env:
          WHISPER_SIGNING_CERTIFICATE: ${{ secrets.WHISPER_SIGNING_CERTIFICATE }}
          WHISPER_SIGNING_PASSWORD: ${{ secrets.WHISPER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$WHISPER_SIGNING_CERTIFICATE" || -z "$WHISPER_SIGNING_PASSWORD" ]]; then
            echo "::error::Release signing credentials are required; ad-hoc releases are not allowed."
            exit 1
          fi
          npm run test:signing
          npm run pack:release

      - name: Verify application
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          app="dist/mac-arm64/Whisper.app"
          plist="$app/Contents/Info.plist"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Whisper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Whisper"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "local.whisper.desktop"
          if [[ -n "$RELEASE_TAG" ]]; then
            node scripts/sign-macos-release.js --verify "$app"
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$VERSION"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = "arm64"

      - name: Archive application and calculate checksum
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p release
          ditto -c -k --keepParent dist/mac-arm64/Whisper.app "release/$ARCHIVE"
          unzip -t "release/$ARCHIVE"
          (
            cd release
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
            shasum -a 256 -c "$ARCHIVE.sha256"
          )

      - name: Upload application package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-arm64
          path: |
            release/${{ steps.metadata.outputs.archive }}
            release/${{ steps.metadata.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
