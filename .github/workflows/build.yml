name: Build

on:
  # CI calls this for pull requests that touch packaging, and Release for v* tags.
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to match against the package version
        required: false
        default: ""
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      archive:
        value: ${{ jobs.build.outputs.archive }}

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Package macOS arm64
    runs-on: macos-15
    timeout-minutes: 45
    # Signing secrets live in the release environment, which only v* tags can use.
    environment: ${{ inputs.release-tag != '' && 'release' || '' }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      archive: ${{ steps.metadata.outputs.archive }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Cargo cache: tag and pull request runs can only read caches saved on
      # their own ref or main, and main never runs this workflow.
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - name: Validate architecture, toolchain and package version
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: scripts/check-version.sh

      - name: Download pinned ffmpeg
        run: scripts/download-ffmpeg.sh

      # Pull request and manual builds do not receive the release signing identity and are signed ad hoc.
      - name: Package development application
        if: inputs.release-tag == ''
        run: scripts/bundle-macos.sh

      # Both variables are always set here, so the signing script fails on an
      # empty secret instead of falling back to local files or ad-hoc signing.
      - name: Package release application with the persistent signing identity
        if: inputs.release-tag != ''
        env:
          WHISPER_SIGNING_CERTIFICATE: ${{ secrets.WHISPER_SIGNING_CERTIFICATE }}
          WHISPER_SIGNING_PASSWORD: ${{ secrets.WHISPER_SIGNING_PASSWORD }}
        run: scripts/bundle-macos.sh --release

      - name: Verify application
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          app="dist/Whisper.app"
          plist="$app/Contents/Info.plist"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")" = "Whisper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "Whisper"
          test -f "$app/Contents/Resources/Assets.car"
          codesign --verify --deep --strict "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.softmaxe.whisper"
          if [[ -n "$RELEASE_TAG" ]]; then
            scripts/sign-macos-release.sh verify "$app"
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$VERSION"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = "arm64"

      - name: Archive application and calculate checksum
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p release
          ditto -c -k --keepParent dist/Whisper.app "release/$ARCHIVE"
          unzip -t "release/$ARCHIVE"
          (
            cd release
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
            shasum -a 256 -c "$ARCHIVE.sha256"
          )

      - name: Upload application package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-arm64
          path: |
            release/${{ steps.metadata.outputs.archive }}
            release/${{ steps.metadata.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
