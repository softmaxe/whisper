name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Check native app and legacy regressions
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate architecture and package version
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          node <<'NODE'
          const assert = require("node:assert/strict");
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          assert.equal(process.versions.node.split(".")[0], "24");
          assert.match(pkg.version, /^[0-9]+\.[0-9]+\.[0-9]+$/);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[""].version, pkg.version);
          NODE

      - name: Install native codec build dependency
        run: command -v pkg-config >/dev/null || brew install pkgconf

      - name: Install dependencies
        run: npm ci

      - name: Check native app and legacy regressions
        run: npm run quality-check

      - name: Record and validate native toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun swift --version
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 27
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 27

      - name: Test native workflows
        run: npm run native:test

      - name: Package credential-free native development app
        run: npm run pack
