name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pushes to main always run the checks: Release requires them on the tagged
  # commit, and they refresh the cache that pull requests restore.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      package: ${{ steps.paths.outputs.package }}
    steps:
      - name: Classify changed paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -z "$PR_NUMBER" ]]; then
            printf 'code=true\npackage=false\n' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          package=false
          while IFS= read -r file; do
            case "$file" in
              docs/* | *.md | LICENSE) ;;
              *) code=true ;;
            esac
            case "$file" in
              .github/workflows/build.yml | .github/workflows/ci.yml | assets/* | build.rs | packaging/* | resources/* | \
                scripts/build-mediaremote-adapter.sh | scripts/bundle-macos.sh | scripts/check-version.sh | \
                scripts/download-ffmpeg.sh | scripts/sign-macos-release.sh)
                package=true
                ;;
            esac
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          printf 'code=%s\npackage=%s\n' "$code" "$package" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Check Whisper
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only main saves the cache, so pull requests reuse it without filling
      # the repository's cache quota with a copy per pull request.
      - name: Restore Cargo downloads and build output
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-

      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - name: Validate architecture, toolchain and package version
        run: scripts/check-version.sh

      - name: Check Whisper
        run: scripts/check.sh

      - name: Save Cargo downloads and build output
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint also runs the preinstalled shellcheck over workflow run steps.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh

  # Pull requests that touch packaging build an unsigned package.
  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/build.yml

  # The single required status check: skipped jobs pass, anything else fails.
  result:
    name: CI result
    if: always()
    needs: [changes, checks, lint, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::A required CI job finished with $result."
              exit 1
            fi
          done
